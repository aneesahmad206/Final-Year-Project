<!DOCTYPE html>
<html>
<head>
    <title>Cyberbullying Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f1f1;
            text-align: center;
            padding-top: 100px;
        }
        input[type="text"] {
            width: 400px;
            padding: 10px;
        }
        input[type="submit"] {
            padding: 10px 20px;
        }
        .result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Cyberbullying Detection</h1>
    <form action="/predict" method="post">
        <input type="text" name="text" placeholder="Enter your text here" required />
        <br><br>
        <input type="submit" value="Check" />
    </form>
    {% if prediction_text %}
        <div class="result">{{ prediction_text }}</div>
    {% endif %}
</body>
</html>
